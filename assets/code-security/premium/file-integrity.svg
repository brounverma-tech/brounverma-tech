<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="294" viewBox="0 0 1200 294" role="img" aria-labelledby="title desc"><title id="title">File Integrity Checker. Detect file modifications by comparing SHA-256 hashes with a saved baseline. View repository.</title><desc id="desc">File Integrity Checker. Detect file modifications by comparing SHA-256 hashes with a saved baseline. View repository.</desc><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#15241c"/><stop offset="1" stop-color="#0a1014"/></linearGradient></defs><style>.pulse{animation:pulse 4s ease-in-out infinite}.trace{animation:trace 7s linear infinite}@keyframes pulse{50%{opacity:.35}}@keyframes trace{to{stroke-dashoffset:-240}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="294" fill="#0b1413"/><path d="M1 40V254" stroke="#a2ff78" stroke-width="3"/><text x="34" y="53" fill="#a2ff78" font-size="25" font-weight="400" font-family="Consolas,Liberation Mono,monospace">02</text><text x="94" y="62" fill="#f1f4ed" font-size="42" font-weight="600" font-family="Arial,Helvetica,sans-serif">File Integrity Checker</text><text x="94" y="112" fill="#b0bdb8" font-size="27" font-weight="400" font-family="Arial,Helvetica,sans-serif">Detect file modifications by comparing SHA-256 hashes with a saved baseline.</text><rect x="94" y="209" width="112" height="40" rx="7" fill="#13251b" stroke="#35513a"/><text x="110" y="236" fill="#a2ff78" font-size="21" font-weight="400" font-family="Consolas,Liberation Mono,monospace">PYTHON</text><rect x="216" y="209" width="125" height="40" rx="7" fill="#13251b" stroke="#35513a"/><text x="232" y="236" fill="#a2ff78" font-size="21" font-weight="400" font-family="Consolas,Liberation Mono,monospace">SHA-256</text><rect x="900" y="201" width="256" height="62" rx="7" fill="#a2ff78" stroke="#a2ff78"/><text x="922" y="241" fill="#11200b" font-size="23" font-weight="600" font-family="Arial,Helvetica,sans-serif">View repository</text><text x="1116" y="240" fill="#11200b" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">↗</text><path d="M30 293H1170" stroke="#263d32"/></svg>